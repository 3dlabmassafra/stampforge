<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROLED 3D — Generatore Lettere & Insegne LED 3D (STL)</title>
  <meta name="description" content="Generatore 3D professionale per lettere e loghi LED corporei 3D. Importa SVG o digita testo ed esporta i file STL per la stampa 3D." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
  
  <style>
    :root {
      --bg-dark: #0a0d14;
      --panel-bg: rgba(16, 22, 36, 0.85);
      --panel-border: rgba(41, 121, 255, 0.25);
      --accent: #2979ff;
      --accent-hover: #5393ff;
      --accent-glow: rgba(41, 121, 255, 0.4);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --card-bg: rgba(255, 255, 255, 0.03);
      --input-bg: rgba(6, 10, 18, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #sidebar {
      width: 420px;
      height: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    .brand-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(41, 121, 255, 0.05);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #2979ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar-content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }

    .control-group {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.3s ease;
    }

    .control-group:hover {
      border-color: rgba(41, 121, 255, 0.3);
    }

    .group-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    label span.value-val {
      color: var(--accent);
      font-weight: 700;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .file-drop-area {
      position: relative;
      border: 2px dashed rgba(41, 121, 255, 0.4);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: rgba(41, 121, 255, 0.03);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-drop-area:hover, .file-drop-area.dragover {
      border-color: var(--accent);
      background: rgba(41, 121, 255, 0.1);
    }

    .file-drop-area input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-icon {
      font-size: 28px;
      margin-bottom: 6px;
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .tab-group {
      display: flex;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(41, 121, 255, 0.4);
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--panel-border);
      background: rgba(6, 10, 18, 0.9);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, #1565c0 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px var(--accent-glow);
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      border-color: var(--accent);
    }

    #viewport-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .viewport-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 5;
    }

    .view-btn {
      padding: 8px 14px;
      background: rgba(16, 22, 36, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-btn:hover, .view-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .light-status-pill {
      position: absolute;
      bottom: 20px;
      left: 20px;
      padding: 8px 16px;
      background: rgba(16, 22, 36, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <aside id="sidebar">
      <div class="brand-header">
        <div class="brand-title">
          <span>⚡ PROLED 3D</span>
        </div>
        <span class="brand-badge">v2.0 WEB</span>
      </div>

      <div class="sidebar-content">

        <div class="control-group">
          <div class="group-title">1. Sorgente Forma</div>
          
          <div class="field">
            <div class="tab-group">
              <button class="tab-btn active" id="mode-text-btn" onclick="setMode('text')">🔤 TESTO</button>
              <button class="tab-btn" id="mode-svg-btn" onclick="setMode('svg')">🖼️ CARICA SVG</button>
            </div>
          </div>

          <div id="section-text-input">
            <div class="field">
              <label>Testo Insegna</label>
              <input type="text" id="text-input" value="LED" placeholder="Es. CAFE, LED, LOGO..." oninput="updateModel()" />
            </div>

            <div class="field">
              <label>Font Stile</label>
              <select id="font-select" onchange="updateModel()">
                <option value="Impact">Impact (Sans Bold)</option>
                <option value="Arial Black">Arial Black</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
                <option value="Georgia">Georgia Bold</option>
              </select>
            </div>

            <div class="field">
              <label>Altezza Testo (mm) <span class="value-val" id="text-size-val">100</span></label>
              <input type="range" id="text-size" min="30" max="300" value="100" oninput="updateModel()" />
            </div>
          </div>

          <div id="section-svg-input" style="display: none;">
            <div class="field">
              <div class="file-drop-area" id="drop-area">
                <div class="file-icon">📁</div>
                <div style="font-size: 13px; font-weight: 600;">Sfoglia o Trascina un SVG qui</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Formati vettoriali supportati: .svg</div>
                <input type="file" id="svg-file-input" accept=".svg" onchange="handleSvgFile(this.files[0])" />
              </div>
            </div>
          </div>
        </div>

        <div class="control-group">
          <div class="group-title">2. Struttura Insegna</div>
          
          <div class="field">
            <label>Tipo Struttura Base</label>
            <select id="base-type-select" onchange="updateModel()">
              <option value="L1">L1 — Base con Bordo Esterno (Offset Flange)</option>
              <option value="L2">L2 — Base al Ras della Lettera</option>
              <option value="singole">Lettere Singole Staccate</option>
            </select>
          </div>

          <div class="field">
            <label>Profondità Cassa (mm) <span class="value-val" id="depth-val">45</span></label>
            <input type="range" id="depth-range" min="20" max="100" value="45" oninput="updateModel()" />
          </div>

          <div class="field">
            <label>Spessore Pareti (mm) <span class="value-val" id="wall-val">3.0</span></label>
            <input type="range" id="wall-range" min="1.5" max="6.0" step="0.5" value="3.0" oninput="updateModel()" />
          </div>

          <div class="field">
            <label>Margine Bordo Offset (mm) <span class="value-val" id="flange-val">6.0</span></label>
            <input type="range" id="flange-range" min="0" max="20" value="6" oninput="updateModel()" />
          </div>
        </div>

        <div class="control-group">
          <div class="group-title">3. LED & Fissaggio Interno</div>

          <div class="field">
            <label>Larghezza Striscia LED (mm)</label>
            <select id="led-width-select" onchange="updateModel()">
              <option value="10">10 mm (Strisce 5050 / COB / RGB)</option>
              <option value="8">8 mm (Strisce 2835 / Mono)</option>
            </select>
          </div>

          <div class="field">
            <label>Fori Viti a Parete INTERNI</label>
            <div class="tab-group">
              <button class="tab-btn active" id="holes-on-btn" onclick="setHoles(true)">ATTIVI</button>
              <button class="tab-btn" id="holes-off-btn" onclick="setHoles(false)">DISATTIVI</button>
            </div>
          </div>
        </div>

      </div>

      <div class="sidebar-footer">
        <button class="btn-primary" onclick="exportSTL('base')">
          <span>💾 ESPORTA STL BASE (3D)</span>
        </button>
        <button class="btn-secondary" onclick="exportSTL('lid')">
          <span>📄 Esporta STL Coperchio Diffusore</span>
        </button>
      </div>
    </aside>

    <main id="viewport-container">
      <div class="viewport-overlay">
        <button class="view-btn active" id="view-assembled-btn" onclick="setViewMode('assembled')">Anteprima Assemblato</button>
        <button class="view-btn" id="view-exploded-btn" onclick="setViewMode('exploded')">Esploso 3D</button>
        <button class="view-btn" id="view-led-btn" onclick="toggleLEDLight()">💡 Accendi/Spegni LED</button>
      </div>

      <div class="light-status-pill">
        <div class="status-dot" id="led-status-dot"></div>
        <span id="led-status-text">Simulazione LED Attiva</span>
      </div>

      <canvas id="webgl-canvas"></canvas>
    </main>
  </div>

  <script>
    let currentMode = 'text';
    let enableHoles = true;
    let viewMode = 'assembled';
    let isLEDOn = true;
    let loadedSvgShapes = null;

    let scene, camera, renderer, controls;
    let baseMeshGroup, lidMeshGroup, ledStripMeshGroup;

    function init3D() {
      const container = document.getElementById('viewport-container');
      const canvas = document.getElementById('webgl-canvas');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0d14);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 2000);
      camera.position.set(0, -180, 220);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(100, 100, 200);
      scene.add(dirLight);

      const dirLight2 = new THREE.DirectionalLight(0x2979ff, 0.4);
      dirLight2.position.set(-100, -100, -100);
      scene.add(dirLight2);

      const grid = new THREE.GridHelper(400, 40, 0x2979ff, 0x1a2638);
      grid.rotation.x = Math.PI / 2;
      grid.position.z = -2;
      scene.add(grid);

      baseMeshGroup = new THREE.Group();
      lidMeshGroup = new THREE.Group();
      ledStripMeshGroup = new THREE.Group();
      scene.add(baseMeshGroup);
      scene.add(lidMeshGroup);
      scene.add(ledStripMeshGroup);

      window.addEventListener('resize', onWindowResize);
      updateModel();
      animate();
    }

    function onWindowResize() {
      const container = document.getElementById('viewport-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function updateModel() {
      document.getElementById('text-size-val').innerText = document.getElementById('text-size').value;
      document.getElementById('depth-val').innerText = document.getElementById('depth-range').value;
      document.getElementById('wall-val').innerText = document.getElementById('wall-range').value;
      document.getElementById('flange-val').innerText = document.getElementById('flange-range').value;

      while (baseMeshGroup.children.length) baseMeshGroup.remove(baseMeshGroup.children[0]);
      while (lidMeshGroup.children.length) lidMeshGroup.remove(lidMeshGroup.children[0]);
      while (ledStripMeshGroup.children.length) ledStripMeshGroup.remove(ledStripMeshGroup.children[0]);

      const textSize = parseFloat(document.getElementById('text-size').value);
      const depth = parseFloat(document.getElementById('depth-range').value);
      const wall = parseFloat(document.getElementById('wall-range').value);
      const flange = parseFloat(document.getElementById('flange-range').value);
      const baseType = document.getElementById('base-type-select').value;
      const fontName = document.getElementById('font-select').value;
      const textVal = document.getElementById('text-input').value || "LED";

      let shapes = [];
      if (currentMode === 'text') {
        shapes = createTextShapes(textVal, textSize, fontName);
      } else if (loadedSvgShapes && loadedSvgShapes.length) {
        shapes = loadedSvgShapes;
      } else {
        shapes = createTextShapes("LED", textSize, fontName);
      }

      if (!shapes || !shapes.length) return;

      const baseMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.3, metalness: 0.1 });
      const lidMat = new THREE.MeshPhysicalMaterial({ color: 0xe3f2fd, transmission: 0.85, opacity: 1, transparent: true, roughness: 0.1 });
      const ledMat = new THREE.MeshBasicMaterial({ color: isLEDOn ? 0x00e676 : 0x444444 });

      shapes.forEach(shape => {
        if (baseType === 'L1' && flange > 0) {
          const flangeGeo = new THREE.ExtrudeGeometry(shape, { depth: 3, bevelEnabled: false });
          const flangeMesh = new THREE.Mesh(flangeGeo, baseMat);
          flangeMesh.scale.set(1 + (flange/textSize), 1 + (flange/textSize), 1);
          baseMeshGroup.add(flangeMesh);
        }

        const outerGeo = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false });
        const outerMesh = new THREE.Mesh(outerGeo, baseMat);
        baseMeshGroup.add(outerMesh);

        const lidGeo = new THREE.ExtrudeGeometry(shape, { depth: 2.5, bevelEnabled: false });
        const lidMesh = new THREE.Mesh(lidGeo, lidMat);
        
        if (viewMode === 'exploded') {
          lidMesh.position.z = depth + 35;
        } else {
          lidMesh.position.z = depth - 2.5;
        }
        lidMeshGroup.add(lidMesh);

        const ledChannelGeo = new THREE.ExtrudeGeometry(shape, { depth: 1.5, bevelEnabled: false });
        const ledMesh = new THREE.Mesh(ledChannelGeo, ledMat);
        ledMesh.position.z = 2.5;
        ledMesh.scale.set(0.9, 0.9, 1);
        ledStripMeshGroup.add(ledMesh);
      });

      const box = new THREE.Box3().setFromObject(baseMeshGroup);
      const center = box.getCenter(new THREE.Vector3());
      baseMeshGroup.position.sub(center);
      lidMeshGroup.position.sub(center);
      ledStripMeshGroup.position.sub(center);
    }

    function createTextShapes(text, size, font) {
      const shape = new THREE.Shape();
      const w = size * text.length * 0.35;
      const h = size * 0.5;
      shape.moveTo(-w, -h);
      shape.lineTo(w, -h);
      shape.lineTo(w, h);
      shape.lineTo(-w, h);
      shape.closePath();
      return [shape];
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('mode-text-btn').classList.toggle('active', mode === 'text');
      document.getElementById('mode-svg-btn').classList.toggle('active', mode === 'svg');
      document.getElementById('section-text-input').style.display = mode === 'text' ? 'block' : 'none';
      document.getElementById('section-svg-input').style.display = mode === 'svg' ? 'block' : 'none';
      updateModel();
    }

    function setHoles(enable) {
      enableHoles = enable;
      document.getElementById('holes-on-btn').classList.toggle('active', enable);
      document.getElementById('holes-off-btn').classList.toggle('active', !enable);
      updateModel();
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('view-assembled-btn').classList.toggle('active', mode === 'assembled');
      document.getElementById('view-exploded-btn').classList.toggle('active', mode === 'exploded');
      updateModel();
    }

    function toggleLEDLight() {
      isLEDOn = !isLEDOn;
      document.getElementById('led-status-dot').style.background = isLEDOn ? '#00e676' : '#ff1744';
      document.getElementById('led-status-dot').style.boxShadow = isLEDOn ? '0 0 10px #00e676' : 'none';
      document.getElementById('led-status-text').innerText = isLEDOn ? 'Simulazione LED Attiva' : 'LED Spenti';
      updateModel();
    }

    function handleSvgFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        updateModel();
      };
      reader.readAsText(file);
    }

    function exportSTL(type) {
      const exporter = new THREE.STLExporter();
      let targetObj = type === 'base' ? baseMeshGroup : lidMeshGroup;
      const result = exporter.parse(targetObj, { binary: true });
      
      const blob = new Blob([result], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `ProLED3D_${type}_${Date.now()}.stl`;
      link.click();
    }

    window.onload = init3D;
  </script>
</body>
</html>
